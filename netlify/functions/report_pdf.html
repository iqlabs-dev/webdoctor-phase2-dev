<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>iQWEB Report (PDF Render)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Minimal base style (your report-data.js likely injects/uses existing DOM + CSS already in report.html)
       If you want the PDF to match EXACT OSD styling, copy your report.html CSS into this file. -->
  <style>
    body { margin: 0; padding: 0; }
    #loaderSection { padding: 28px 16px; font-family: Arial, sans-serif; text-align: center; }
  </style>

  <script>
  // ============================
  // DocRaptor/Prince Polyfills
  // ============================
  // Prince in DocRaptor can lack Promise/fetch. Your report-data.js uses them.
  (function () {
    // Promise (minimal)
    if (typeof Promise !== "function") {
      function PolyPromise(fn) {
        var state = "pending";
        var value;
        var handlers = [];

        function fulfill(result) {
          state = "fulfilled"; value = result;
          handlers.slice().forEach(handle); handlers = [];
        }
        function reject(err) {
          state = "rejected"; value = err;
          handlers.slice().forEach(handle); handlers = [];
        }
        function resolve(result) {
          try {
            if (result === this) throw new TypeError("Promise self-resolution");
            if (result && (typeof result === "object" || typeof result === "function")) {
              var then = result.then;
              if (typeof then === "function") return then.call(result, resolve, reject);
            }
            fulfill(result);
          } catch (e) { reject(e); }
        }
        function handle(handler) {
          if (state === "pending") { handlers.push(handler); return; }
          var cb = state === "fulfilled" ? handler.onFulfilled : handler.onRejected;
          if (!cb) { (state === "fulfilled" ? handler.resolve : handler.reject)(value); return; }
          try { handler.resolve(cb(value)); } catch (e) { handler.reject(e); }
        }

        this.then = function (onFulfilled, onRejected) {
          return new PolyPromise(function (resolveNext, rejectNext) {
            handle({
              onFulfilled: typeof onFulfilled === "function" ? onFulfilled : null,
              onRejected: typeof onRejected === "function" ? onRejected : null,
              resolve: resolveNext,
              reject: rejectNext,
            });
          });
        };
        this.catch = function (onRejected) { return this.then(null, onRejected); };

        try { fn(resolve, reject); } catch (e) { reject(e); }
      }
      PolyPromise.resolve = function (v) { return new PolyPromise(function (res) { res(v); }); };
      PolyPromise.reject  = function (e) { return new PolyPromise(function (_, rej) { rej(e); }); };
      PolyPromise.all = function (arr) {
        return new PolyPromise(function (resolve, reject) {
          if (!arr || !arr.length) return resolve([]);
          var out = new Array(arr.length);
          var remaining = arr.length;
          for (var i = 0; i < arr.length; i++) (function (i) {
            PolyPromise.resolve(arr[i]).then(function (v) {
              out[i] = v; remaining--; if (remaining === 0) resolve(out);
            }, reject);
          })(i);
        });
      };
      window.Promise = PolyPromise;
    }

    // fetch (minimal, via XHR)
    if (typeof window.fetch !== "function") {
      function Response(bodyText, opts) {
        opts = opts || {};
        this._bodyText = bodyText || "";
        this.status = opts.status || 200;
        this.ok = this.status >= 200 && this.status < 300;
        this.statusText = opts.statusText || "";
      }
      Response.prototype.text = function () { return Promise.resolve(this._bodyText); };
      Response.prototype.json = function () {
        try { return Promise.resolve(JSON.parse(this._bodyText || "{}")); }
        catch (e) { return Promise.reject(e); }
      };

      window.fetch = function (url, opts) {
        opts = opts || {};
        return new Promise(function (resolve, reject) {
          try {
            var xhr = new XMLHttpRequest();
            xhr.open(opts.method || "GET", url, true);

            var headers = opts.headers || {};
            for (var k in headers) if (Object.prototype.hasOwnProperty.call(headers, k)) {
              xhr.setRequestHeader(k, headers[k]);
            }

            xhr.onload = function () {
              resolve(new Response(xhr.responseText, { status: xhr.status, statusText: xhr.statusText }));
            };
            xhr.onerror = function () { reject(new TypeError("Network request failed")); };
            xhr.send(opts.body || null);
          } catch (e) { reject(e); }
        });
      };
    }
  })();
  </script>
</head>
<body>

  <section id="loaderSection">
    <div style="font-weight:700;">Building Report</div>
    <div style="opacity:.7;margin-top:6px;">Rendering full on-screen report for PDF…</div>
  </section>

  <!-- Your report-data.js expects these anchors -->
  <main id="reportRoot" style="display:none;">
    <a id="siteUrl" href="#" target="_blank" rel="noopener noreferrer">—</a>
    <div id="reportId">—</div>
    <div id="reportDate">—</div>

    <div id="narrativeText"></div>
    <div id="fixFirstBlock"></div>

    <div id="overallPill"></div>
    <div id="overallBar"></div>
    <div id="overallNote"></div>

    <div id="signalsGrid"></div>

    <div id="signalEvidenceRoot"></div>
    <div id="keyMetricsRoot"></div>
    <div id="topIssuesRoot"></div>
    <div id="fixSequenceRoot"></div>
    <div id="finalNotesRoot"></div>
  </main>

  <!-- Your real renderer -->
  <script src="/assets/js/report-data.js"></script>

  <!-- DocRaptor gate -->
  <script>
    window.__IQWEB_REPORT_READY = false;

    // Required by DocRaptor when wait_for_javascript=true
    window.docraptorJavaScriptFinished = function () {
      return window.__IQWEB_REPORT_READY === true;
    };

    (function waitReady() {
      var reportRoot = document.getElementById("reportRoot");
      var loader = document.getElementById("loaderSection");
      var signals = document.getElementById("signalsGrid");

      var loaderHidden =
        loader && (loader.style.display === "none" || getComputedStyle(loader).display === "none");

      var reportVisible =
        reportRoot && (reportRoot.style.display !== "none" && getComputedStyle(reportRoot).display !== "none");

      var hasSignals =
        signals && signals.children && signals.children.length > 0;

      if (loaderHidden && reportVisible && hasSignals) {
        window.__IQWEB_REPORT_READY = true;
        return;
      }
      setTimeout(waitReady, 150);
    })();

    // Hard safety
    setTimeout(function () {
      if (!window.__IQWEB_REPORT_READY) window.__IQWEB_REPORT_READY = true;
    }, 30000);
  </script>
</body>
</html>
